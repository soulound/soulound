<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0a">
<title>Soulound 返信トラッカー — 返信できた！</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --white: #f0ede8;
    --white-dim: rgba(240,237,232,0.5);
    --white-faint: rgba(240,237,232,0.08);
    --white-faint2: rgba(240,237,232,0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--bg); color-scheme: dark; }
  button { -webkit-tap-highlight-color: rgba(201,168,76,0.25); touch-action: manipulation; font-family: inherit; }
  body {
    background-color: var(--bg);
    color: var(--white);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding: 34px 20px 90px;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 8px; }
  .eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--white-dim);
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 34px;
    margin-top: 8px;
    color: var(--gold);
  }
  .gold-line { width: 40px; height: 1px; background: var(--gold); margin: 22px auto 30px; opacity: 0.6; }

  /* 合計（達成感の主役） */
  .hero { text-align: center; margin-bottom: 30px; }
  .hero-label {
    font-family: 'Montserrat', sans-serif; font-weight: 300;
    letter-spacing: 0.28em; text-transform: uppercase;
    font-size: 11px; color: var(--white-dim); margin-bottom: 10px;
  }
  .hero-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 92px; line-height: 1; color: var(--gold);
    letter-spacing: 0.01em;
    text-shadow: 0 0 34px rgba(201,168,76,0.28);
    transition: transform .18s cubic-bezier(.2,1.4,.4,1);
    display: inline-block;
  }
  .hero-num.pop { transform: scale(1.14); }
  .hero-unit { font-family: 'Cormorant Garamond', serif; font-size: 30px; color: var(--white-dim); margin-left: 8px; }
  .hero-sub { font-size: 12px; color: var(--white-dim); margin-top: 14px; letter-spacing: 0.05em; }

  /* ボタン */
  .btn-zone { position: relative; text-align: center; margin: 4px 0 40px; }
  .reply-btn {
    position: relative;
    background: linear-gradient(180deg, rgba(201,168,76,0.16), rgba(201,168,76,0.06));
    border: 1px solid var(--gold);
    color: var(--gold-light);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 400;
    font-size: 19px;
    letter-spacing: 0.14em;
    padding: 22px 20px;
    width: 100%;
    max-width: 420px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .3s ease, background .3s ease;
    box-shadow: 0 0 0 rgba(201,168,76,0);
  }
  .reply-btn:hover { background: linear-gradient(180deg, rgba(201,168,76,0.24), rgba(201,168,76,0.09)); box-shadow: 0 8px 40px rgba(201,168,76,0.14); }
  .reply-btn:active { transform: scale(0.97); }
  .reply-btn .ico { font-size: 15px; margin-right: 10px; opacity: 0.85; }
  .reply-btn.flash { animation: flash .5s ease; }
  @keyframes flash {
    0% { box-shadow: 0 0 0 0 rgba(201,168,76,0.5); }
    100% { box-shadow: 0 0 0 26px rgba(201,168,76,0); }
  }
  .undo {
    display: inline-block; margin-top: 16px;
    background: none; border: none; cursor: pointer;
    font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0.14em;
    color: var(--white-dim); text-transform: uppercase;
    transition: color .2s ease;
  }
  .undo:hover { color: var(--gold); }
  .undo:disabled { opacity: 0.3; cursor: default; }
  .undo:disabled:hover { color: var(--white-dim); }

  /* 浮かぶ +1 */
  .float1 {
    position: absolute; left: 50%; top: 6px;
    transform: translateX(-50%);
    font-family: 'Cormorant Garamond', serif; font-size: 30px; color: var(--gold-light);
    pointer-events: none; opacity: 0;
  }
  .float1.go { animation: rise 1s ease-out forwards; }
  @keyframes rise {
    0% { opacity: 0; transform: translate(-50%, 6px) scale(0.8); }
    18% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -54px) scale(1.05); }
  }

  /* 統計カード */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 40px; }
  .stat { border: 1px solid var(--white-faint); border-radius: 6px; padding: 18px 10px; text-align: center; }
  .stat .n { font-family: 'Cormorant Garamond', serif; font-size: 40px; line-height: 1; color: var(--white); }
  .stat.accent .n { color: var(--gold); }
  .stat .l {
    font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--white-dim); margin-top: 10px;
  }

  /* グラフ */
  .chart-card { border: 1px solid var(--white-faint); border-radius: 6px; padding: 24px 18px 18px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  .chart-head h2 {
    font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 12px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--white);
  }
  .rangebar { display: flex; gap: 0; }
  .rangebar button {
    background: transparent; border: 1px solid var(--white-faint); border-left: none;
    color: var(--white-dim); font-family: 'Montserrat', sans-serif; font-size: 11px;
    letter-spacing: 0.06em; padding: 6px 12px; cursor: pointer; transition: all .2s ease;
  }
  .rangebar button:first-child { border-left: 1px solid var(--white-faint); border-radius: 3px 0 0 3px; }
  .rangebar button:last-child { border-radius: 0 3px 3px 0; }
  .rangebar button.active { background: var(--gold); color: var(--bg); border-color: var(--gold); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }

  .bar { transition: height .4s cubic-bezier(.2,.9,.3,1), y .4s cubic-bezier(.2,.9,.3,1); cursor: default; }
  .bar-track { fill: var(--white-faint); }
  .bar-val { fill: url(#goldGrad); }
  .bar-today { fill: var(--gold-light); }
  .tick { font-family: 'Montserrat', sans-serif; font-size: 9px; fill: var(--white-dim); }
  .barcount { font-family: 'Montserrat', sans-serif; font-size: 9px; fill: var(--gold-light); }

  .empty-note { text-align: center; color: var(--white-dim); font-size: 12px; padding: 30px 0; line-height: 1.9; }

  /* フッター操作 */
  .tools { display: flex; justify-content: center; gap: 22px; margin-top: 34px; flex-wrap: wrap; }
  .tools button {
    background: none; border: none; cursor: pointer;
    font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--white-dim); transition: color .2s ease;
  }
  .tools button:hover { color: var(--gold); }
  .tools .danger:hover { color: #d98a7a; }

  footer { text-align: center; margin-top: 40px; font-size: 11px; color: var(--white-dim); letter-spacing: 0.04em; line-height: 1.9; }
  footer a { color: var(--white-dim); text-decoration: none; border-bottom: 1px solid var(--white-faint); }
  footer a:hover { color: var(--gold); }

  /* トースト */
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: rgba(20,18,14,0.96); border: 1px solid var(--gold); color: var(--gold-light);
    font-size: 13px; letter-spacing: 0.05em; padding: 13px 22px; border-radius: 6px;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
    z-index: 50; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Soulound · Reply Tracker</div>
    <h1>返信できた！</h1>
  </header>
  <div class="gold-line"></div>

  <!-- 合計（達成感の主役） -->
  <div class="hero">
    <div class="hero-label">これまでの累計返信</div>
    <div><span class="hero-num" id="totalNum">0</span><span class="hero-unit">回</span></div>
    <div class="hero-sub" id="heroSub">最初の一通から始めよう。</div>
  </div>

  <!-- ボタン -->
  <div class="btn-zone">
    <button type="button" class="reply-btn" id="replyBtn">
      <span class="ico">✦</span>返信できた
    </button>
    <div class="float1" id="float1">+1</div>
    <div>
      <button type="button" class="undo" id="undoBtn" disabled>▲ 直前の1回を取り消す</button>
    </div>
  </div>

  <!-- 統計 -->
  <div class="stats">
    <div class="stat accent"><div class="n" id="todayNum">0</div><div class="l">今日</div></div>
    <div class="stat"><div class="n" id="streakNum">0</div><div class="l">連続日数</div></div>
    <div class="stat"><div class="n" id="bestNum">0</div><div class="l">1日の最高</div></div>
  </div>

  <!-- グラフ -->
  <div class="chart-card">
    <div class="chart-head">
      <h2>1日ごとの返信数</h2>
      <div class="rangebar" id="rangeBar">
        <button type="button" data-days="7">7日</button>
        <button type="button" data-days="14" class="active">14日</button>
        <button type="button" data-days="30">30日</button>
      </div>
    </div>
    <div id="chartArea"></div>
  </div>

  <div class="tools">
    <button type="button" id="exportBtn">データを書き出す</button>
    <button type="button" id="importBtn">読み込む</button>
    <button type="button" class="danger" id="resetBtn">リセット</button>
  </div>

  <footer>
    記録はこの端末のブラウザ内に自動保存されます（サーバー送信なし）。<br>
    同じブラウザで開けば、いつでも続きから記録できます。<br>
    <a href="../">← Soulound トップへ</a>
  </footer>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
(function () {
  "use strict";

  var KEY = "soulound_reply_tracker_v1";
  var MAX_HISTORY = 400;   // 取り消し用ログの上限

  // ---- 状態 ----
  var state = load();
  var rangeDays = 14;

  function todayKey(d) {
    d = d || new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && typeof s === "object") {
          s.total = s.total || 0;
          s.daily = s.daily || {};
          s.log = s.log || [];
          return s;
        }
      }
    } catch (e) {}
    return { total: 0, daily: {}, log: [] };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast("保存できませんでした（プライベートモード？）"); }
  }

  // ---- 記録の増減 ----
  function addOne() {
    var k = todayKey();
    state.daily[k] = (state.daily[k] || 0) + 1;
    state.total += 1;
    state.log.push(Date.now());
    if (state.log.length > MAX_HISTORY) state.log = state.log.slice(-MAX_HISTORY);
    save();
  }

  function undoOne() {
    if (state.total <= 0) return false;
    var k = todayKey();
    // 取り消しは「今日の分」に対して行う（今日ゼロなら不可）
    if (!state.daily[k]) { toast("今日の記録がないため取り消せません"); return false; }
    state.daily[k] -= 1;
    if (state.daily[k] <= 0) delete state.daily[k];
    state.total = Math.max(0, state.total - 1);
    if (state.log.length) state.log.pop();
    save();
    return true;
  }

  // ---- 集計 ----
  function computeStreak() {
    var streak = 0;
    var d = new Date();
    // 今日が0でも、昨日まで続いていれば連続日数は昨日基準で数える
    if (!state.daily[todayKey(d)]) d.setDate(d.getDate() - 1);
    while (state.daily[todayKey(d)]) {
      streak += 1;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function bestDay() {
    var best = 0;
    for (var k in state.daily) if (state.daily[k] > best) best = state.daily[k];
    return best;
  }

  function lastNDays(n) {
    var arr = [];
    var d = new Date();
    for (var i = n - 1; i >= 0; i--) {
      var dd = new Date(d);
      dd.setDate(d.getDate() - i);
      var k = todayKey(dd);
      arr.push({ key: k, date: dd, count: state.daily[k] || 0 });
    }
    return arr;
  }

  // ---- 描画 ----
  var totalNum = document.getElementById("totalNum");
  var heroSub = document.getElementById("heroSub");
  var todayNum = document.getElementById("todayNum");
  var streakNum = document.getElementById("streakNum");
  var bestNum = document.getElementById("bestNum");
  var undoBtn = document.getElementById("undoBtn");

  function heroMessage(total, today) {
    if (total === 0) return "最初の一通から始めよう。";
    if (today === 0) return "今日はまだ0回。ひと息ついたら、一通いこう。";
    if (today >= 10) return "今日はすごい。よくやりきった。";
    if (today >= 5) return "いい流れ。今日もしっかり返せている。";
    if (today >= 1) return "その一通、ちゃんと届いた。えらい。";
    return "";
  }

  function renderStats() {
    var today = state.daily[todayKey()] || 0;
    totalNum.textContent = state.total;
    todayNum.textContent = today;
    streakNum.textContent = computeStreak();
    bestNum.textContent = bestDay();
    heroSub.textContent = heroMessage(state.total, today);
    undoBtn.disabled = today <= 0;
  }

  var chartArea = document.getElementById("chartArea");

  function renderChart() {
    var data = lastNDays(rangeDays);
    var hasAny = data.some(function (d) { return d.count > 0; });
    if (!hasAny && state.total === 0) {
      chartArea.innerHTML = '<div class="empty-note">まだ記録がありません。<br>「返信できた」を押すと、ここに今日の棒が立ち上がります。</div>';
      return;
    }

    var W = 680, H = 240;
    var padL = 6, padR = 6, padTop = 22, padBottom = 26;
    var innerW = W - padL - padR;
    var innerH = H - padTop - padBottom;
    var n = data.length;
    var slot = innerW / n;
    var barW = Math.min(slot * 0.62, 30);
    var maxVal = Math.max(1, data.reduce(function (m, d) { return Math.max(m, d.count); }, 0));
    var tk = todayKey();

    var showEveryLabel = n <= 14;

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="1日ごとの返信数の棒グラフ">';
    svg += '<defs><linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">' +
           '<stop offset="0%" stop-color="#e8c96a"/><stop offset="100%" stop-color="#b8973f"/>' +
           '</linearGradient></defs>';

    // ベースライン
    var baseY = padTop + innerH;
    svg += '<line x1="' + padL + '" y1="' + baseY + '" x2="' + (W - padR) + '" y2="' + baseY + '" stroke="rgba(240,237,232,0.14)" stroke-width="1"/>';

    for (var i = 0; i < n; i++) {
      var d = data[i];
      var cx = padL + slot * i + slot / 2;
      var x = cx - barW / 2;
      var h = (d.count / maxVal) * innerH;
      var y = baseY - h;
      var isToday = d.key === tk;

      // トラック（薄い背景棒）
      svg += '<rect class="bar-track" x="' + x.toFixed(1) + '" y="' + padTop + '" width="' + barW.toFixed(1) +
             '" height="' + innerH + '" rx="3"/>';

      // 値棒
      if (d.count > 0) {
        svg += '<rect class="bar ' + (isToday ? 'bar-today' : 'bar-val') + '" x="' + x.toFixed(1) +
               '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3">' +
               '<title>' + d.key + '：' + d.count + '回</title></rect>';
        // 数値ラベル
        svg += '<text class="barcount" x="' + cx.toFixed(1) + '" y="' + (y - 6).toFixed(1) +
               '" text-anchor="middle">' + d.count + '</text>';
      }

      // 日付ラベル
      var label = (d.date.getMonth() + 1) + "/" + d.date.getDate();
      var drawLabel = showEveryLabel || i === 0 || i === n - 1 || (i % Math.ceil(n / 8) === 0);
      if (drawLabel) {
        svg += '<text class="tick" x="' + cx.toFixed(1) + '" y="' + (baseY + 15) +
               '" text-anchor="middle"' + (isToday ? ' fill="#e8c96a"' : '') + '>' + label + '</text>';
      }
    }

    svg += '</svg>';
    chartArea.innerHTML = svg;
  }

  function renderAll() { renderStats(); renderChart(); }

  // ---- インタラクション ----
  var replyBtn = document.getElementById("replyBtn");
  var float1 = document.getElementById("float1");
  var heroNum = totalNum;

  replyBtn.addEventListener("click", function () {
    addOne();
    renderAll();

    // 達成感の演出
    heroNum.classList.remove("pop"); void heroNum.offsetWidth; heroNum.classList.add("pop");
    replyBtn.classList.remove("flash"); void replyBtn.offsetWidth; replyBtn.classList.add("flash");
    float1.classList.remove("go"); void float1.offsetWidth; float1.classList.add("go");

    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  });

  undoBtn.addEventListener("click", function () {
    if (undoOne()) { renderAll(); toast("直前の1回を取り消しました"); }
  });

  // 期間切り替え
  document.getElementById("rangeBar").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    rangeDays = parseInt(b.getAttribute("data-days"), 10);
    [].forEach.call(this.querySelectorAll("button"), function (x) { x.classList.remove("active"); });
    b.classList.add("active");
    renderChart();
  });

  // 書き出し
  document.getElementById("exportBtn").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "soulound-reply-tracker-" + todayKey() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast("データを書き出しました");
  });

  // 読み込み
  var fileInput = document.getElementById("fileInput");
  document.getElementById("importBtn").addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var s = JSON.parse(reader.result);
        if (!s || typeof s !== "object" || typeof s.daily !== "object") throw new Error("bad");
        state = { total: s.total || 0, daily: s.daily || {}, log: s.log || [] };
        // total と daily の整合を軽く担保
        if (!s.total) {
          var sum = 0; for (var k in state.daily) sum += state.daily[k];
          state.total = sum;
        }
        save(); renderAll();
        toast("データを読み込みました");
      } catch (e) { toast("読み込めませんでした（形式が不正です）"); }
      fileInput.value = "";
    };
    reader.readAsText(f);
  });

  // リセット
  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!confirm("すべての記録を消去します。よろしいですか？\n（先に「データを書き出す」でバックアップできます）")) return;
    state = { total: 0, daily: {}, log: [] };
    save(); renderAll();
    toast("記録をリセットしました");
  });

  // トースト
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  // 別タブでの更新に追従
  window.addEventListener("storage", function (e) {
    if (e.key === KEY) { state = load(); renderAll(); }
  });
  // 日付が変わった場合に備えて、表示に戻ったら再描画
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) renderAll();
  });

  renderAll();
})();
</script>
</body>
</html>
